  img_size: [64, 128]
  patch_size: 4
  embed_dim: 1024
  depth: 8
  decoder_depth: 2
  num_heads: 16
  mlp_ratio: 4.0
  drop_path: 0.2
  drop_rate: 0.2
  const_dir: ${paths.data_dir}

mean_path: ${paths.data_dir}/normalize_mean.npz
std_path: ${paths.data_dir}/normalize_std.npz
clim_paths:
