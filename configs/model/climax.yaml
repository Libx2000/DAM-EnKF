_target_: src.models.forecast.forecast_module.ForecastLitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-4
  betas: [0.9, 0.99]
  weight_decay: 1e-5

scheduler:
  _target_: src.utils.train_utils.GradualWarmupScheduler
  _partial_: true
  multiplier: 1
  total_epoch: 10

after_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 100
  eta_min: 1e-8
  verbose: True

net:
  _target_: src.models.forecast.climax.arch.ClimaX
  default_vars: [
    "land_sea_mask", "orography", "latitude", "longitude",
    "2m_temperature", "10m_u_component_of_wind", "10m_v_component_of_wind", "total_precipitation",
